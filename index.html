      el('text', { x: 100, y: 76.6, 'text-anchor': 'middle', 'dominant-baseline': 'central', 'font-size': 2.9, 'letter-spacing': 0.6, class: 'ink sans' }, tx, 'FLYBACK');
      const bt = el('text', { 'font-size': 2.4, 'letter-spacing': 0.3, class: 'ink sans', 'text-anchor': 'middle' }, tx);
      const tp2 = el('textPath', { href: '#g-arc-bottom', startOffset: '50%' }, bt, 'MADE IN GERMANY');
      tp2.setAttributeNS('http://www.w3.org/1999/xlink', 'xlink:href', '#g-arc-bottom');

      // Discs de la gran data: desenes 0–3 (+0 de tornada) i unitats 0–9 (+0)
      const tens = $('g-tens'), units = $('g-units');
      for (let i = 0; i <= 4; i++) el('text', { x: 93.7, y: 129.4 + i * 16, 'text-anchor': 'middle', 'dominant-baseline': 'central', 'font-size': 13, 'font-weight': '700', class: 'sans win-ink' }, tens, String(i % 4));
      for (let i = 0; i <= 10; i++) el('text', { x: 106.3, y: 129.4 + i * 16, 'text-anchor': 'middle', 'dominant-baseline': 'central', 'font-size': 13, 'font-weight': '700', class: 'sans win-ink' }, units, String(i % 10));

      // Agulles "pera" d'acer pavonat
      function pear(id, L, rx, ry) {
        const g = $(id);
        el('rect', { x: 99.25, y: 100 - L * 0.66, width: 1.5, height: L * 0.66 + 6, fill: 'url(#blued)' }, g);
        el('ellipse', { cx: 100, cy: 100 - L * 0.74, rx, ry, fill: 'url(#blued)' }, g);
        el('path', { d: `M${100 - rx * 0.55} ${100 - L * 0.8} L100 ${100 - L} L${100 + rx * 0.55} ${100 - L * 0.8} Z`, fill: 'url(#blued)' }, g);
        el('circle', { cx: 100, cy: 106, r: 1.6, fill: 'url(#blued)' }, g);
      }
      pear('g-hour', 41, 3.1, 5.2);
      pear('g-minute', 64, 2.6, 5.6);
      const cs = $('g-csec');
      el('rect', { x: 99.65, y: 20, width: 0.7, height: 96, fill: 'url(#blued)' }, cs);
      el('path', { d: 'M100 15.5 L101.1 21 L98.9 21 Z', fill: 'url(#blued)' }, cs);
      el('circle', { cx: 100, cy: 112.5, r: 1.7, fill: 'none', stroke: 'url(#blued)', 'stroke-width': 0.8 }, cs);
      subHand($('g-ssec'), ...G.c9, 15.5, 0.6, 3.5);
      subHand($('g-cmin'), ...G.c3, 15.5, 0.75, 3.5);
    })();

    // =================================================================
    //  Utilitats de dates i festius (mateixa lògica que l'índex PRS 516)
    // =================================================================
    function pad2(n) { return String(n).padStart(2, '0'); }
    function isoOf(d) { return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`; }
    function normName(name) { return String(name || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toUpperCase().trim(); }
    function addDays(date, days) { const d = new Date(date); d.setDate(d.getDate() + days); return d; }
    const WINDOW_TEXT = {
      ca: { d: ['DG', 'DL', 'DT', 'DC', 'DJ', 'DV', 'DS'], m: ['GEN', 'FEB', 'MAR', 'ABR', 'MAI', 'JUN', 'JUL', 'AGO', 'SET', 'OCT', 'NOV', 'DES'] },
      en: { d: ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'], m: ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'] }
    };
    const LANG_KEY = 'malv_giul_lang';
    const windowLang = 'ca'; // dies i mesos del MALVINES sempre en català (DS, DG, DL…)
    try { localStorage.removeItem(LANG_KEY); } catch (e) {}
    const monthNames = ['Gener', 'Febrer', 'Març', 'Abril', 'Maig', 'Juny', 'Juliol', 'Agost', 'Setembre', 'Octubre', 'Novembre', 'Desembre'];
    const dayNamesCa = ['Diumenge', 'Dilluns', 'Dimarts', 'Dimecres', 'Dijous', 'Divendres', 'Dissabte'];
    function deMes(m) { const n = monthNames[m].toLowerCase(); return /^[aeiouàèéíòóú]/.test(n) ? `d'${n}` : `de ${n}`; }

    const HOLIDAYS_CACHE_KEY = 'malv_giul_holidays_bcn_v2';
    const HOLIDAYS_TTL_MS = 24 * 60 * 60 * 1000;
    const HOLIDAYS_RETRY_MS = 60 * 60 * 1000;
    const DEFAULT_MUNICIPALITY = 'Barcelona';
    // Festius sempre de Barcelona (no depenen de la geolocalització)
    let holidayMunicipality = DEFAULT_MUNICIPALITY;
    // Homenatge: l'1 d'octubre, en record del referèndum del 2017
    const HOMAGE_MMDD = '10-01';
    const HOMAGE_NAME = "1 d'Octubre · homenatge al referèndum del 2017";
    // Calendaris verificats (Generalitat + Ajuntament de Barcelona). La font
    // principal continua sent l'API de dades obertes; això és la reserva.
    const VERIFIED_HOLIDAYS = {
      2026: ['01-01', '01-06', '04-03', '04-06', '05-01', '05-25', '06-24', '08-15', '09-11', '09-24', '10-12', '11-01', '12-08', '12-25', '12-26'],
      2027: ['01-01', '01-06', '03-26', '03-29', '05-01', '05-17', '06-24', '09-11', '09-24', '10-12', '11-01', '12-06', '12-08', '12-25']
    };
    function withHomage(year, set) { set.add(`${year}-${HOMAGE_MMDD}`); return set; }
    const holidayMemory = new Map();
    const holidayPending = new Map();
    function holidayKey(year, muni) { return `${year}|${normName(muni)}`; }
    function readHolidayCache() { try { return JSON.parse(localStorage.getItem(HOLIDAYS_CACHE_KEY)) || {}; } catch (e) { return {}; } }
    function writeHolidayCache(cache) {
      const limit = Date.now() - 30 * 864e5;
      Object.keys(cache).forEach(k => { if (cache[k].expiresAt < limit) delete cache[k]; });
      try { localStorage.setItem(HOLIDAYS_CACHE_KEY, JSON.stringify(cache)); } catch (e) {}
    }
    function easterSunday(year) {
      const a = year % 19, b = Math.floor(year / 100), c = year % 100;
      const d = Math.floor(b / 4), e = b % 4, f = Math.floor((b + 8) / 25);
      const g = Math.floor((b - f + 1) / 3), h = (19 * a + b - d - g + 15) % 30;
      const i = Math.floor(c / 4), k = c % 4, l = (32 + 2 * e + 2 * i - h - k) % 7;
      const m = Math.floor((a + 11 * h + 22 * l) / 451);
      const month = Math.floor((h + l - 7 * m + 114) / 31);
      const day = ((h + l - 7 * m + 114) % 31) + 1;
      return new Date(year, month - 1, day);
    }
    // Noms dels festius (les dades obertes només donen la data)
    function holidayNames(year) {
      const map = {
        '01-01': "Cap d'Any", '01-06': 'Reis', '05-01': 'Festa del Treball', '06-24': 'Sant Joan',
        '08-15': "L'Assumpció", '09-11': 'Diada Nacional de Catalunya', '10-12': "Festa Nacional d'Espanya",
        '11-01': 'Tots Sants', '12-06': 'Dia de la Constitució', '12-08': 'La Immaculada',
        '12-25': 'Nadal', '12-26': 'Sant Esteve'
      };
      const out = {};
      Object.keys(map).forEach(k => out[`${year}-${k}`] = map[k]);
      const e = easterSunday(year);
      out[isoOf(addDays(e, -2))] = 'Divendres Sant';
      out[isoOf(addDays(e, 1))] = 'Dilluns de Pasqua Florida';
      if (normName(holidayMunicipality) === normName(DEFAULT_MUNICIPALITY)) {
        out[isoOf(addDays(e, 50))] = 'Dilluns de Pasqua Granada';
        out[`${year}-09-24`] = 'La Mercè';
      }
      return out;
    }
    function holidayName(iso) {
      if (iso.slice(5) === HOMAGE_MMDD) return HOMAGE_NAME;
      return holidayNames(+iso.slice(0, 4))[iso] || 'Festa local';
    }
    function localMunicipalFallback(year, muni) {
      if (normName(muni) !== normName(DEFAULT_MUNICIPALITY)) return [];
      return [isoOf(addDays(easterSunday(year), 50)), `${year}-09-24`];
    }
    function computeLocalHolidays(year, muni) {
      if (VERIFIED_HOLIDAYS[year]) return withHomage(year, new Set(VERIFIED_HOLIDAYS[year].map(md => `${year}-${md}`)));
      const set = new Set();
      [[1, 1], [1, 6], [5, 1], [8, 15], [10, 12], [11, 1], [12, 6], [12, 8], [12, 25], [6, 24], [9, 11], [12, 26]]
        .forEach(([m, d]) => set.add(`${year}-${pad2(m)}-${pad2(d)}`));
      const e = easterSunday(year);
      set.add(isoOf(addDays(e, -2)));
      set.add(isoOf(addDays(e, 1)));
      localMunicipalFallback(year, muni).forEach(iso => set.add(iso));
      return withHomage(year, set);
    }
    async function fetchJsonArray(url) {
      const res = await fetch(url);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      if (!Array.isArray(data)) throw new Error('Resposta inesperada');
      return data;
    }
    function localHolidaysUrl(year, muni) {
      const where = `upper(ajuntament_o_nucli_municipal)='${normName(muni).replace(/'/g, "''")}'`;
      return `https://analisi.transparenciacatalunya.cat/resource/b4eh-r8up.json?any_calendari=${year}&$where=${encodeURIComponent(where)}`;
    }
    function getHolidaysSync(year) {
      const key = holidayKey(year, holidayMunicipality);
      if (holidayMemory.has(key)) return holidayMemory.get(key);
      const cached = readHolidayCache()[key];
      if (cached) { const s = withHomage(year, new Set(cached.dates)); holidayMemory.set(key, s); return s; }
      return computeLocalHolidays(year, holidayMunicipality);
    }
    function loadHolidays(year) {
      const muni = holidayMunicipality;
      const key = holidayKey(year, muni);
      const cache = readHolidayCache();
      const entry = cache[key];
      if (entry && entry.expiresAt > Date.now()) { const s = withHomage(year, new Set(entry.dates)); holidayMemory.set(key, s); return Promise.resolve(s); }
      if (holidayPending.has(key)) return holidayPending.get(key);
      const promise = (async () => {
        let dates, ttl = HOLIDAYS_TTL_MS;
        try {
          const [regional, local] = await Promise.all([
            fetchJsonArray(`https://analisi.transparenciacatalunya.cat/resource/yf2b-mjr6.json?any_calendari=${year}`),
            fetchJsonArray(localHolidaysUrl(year, muni))
          ]);
          if (regional.length === 0) throw new Error(`Calendari ${year} encara no publicat`);
          dates = new Set();
          regional.forEach(r => { if (r.data) dates.add(r.data.slice(0, 10)); });
          let localRows = local;
          if (localRows.length === 0 && normName(muni) !== normName(DEFAULT_MUNICIPALITY)) localRows = await fetchJsonArray(localHolidaysUrl(year, DEFAULT_MUNICIPALITY));
          localRows.forEach(r => { if (r.data) dates.add(r.data.slice(0, 10)); });
          if (localRows.length === 0) localMunicipalFallback(year, muni).forEach(iso => dates.add(iso));
          withHomage(year, dates);
        } catch (err) {
          console.warn(`Festius ${year}: càlcul local (${err.message})`);
          dates = entry ? new Set(entry.dates) : computeLocalHolidays(year, muni);
          ttl = HOLIDAYS_RETRY_MS;
        }
        const fresh = readHolidayCache();
        fresh[key] = { dates: Array.from(dates), expiresAt: Date.now() + ttl };
        writeHolidayCache(fresh);
        holidayMemory.set(key, dates);
        return dates;
      })();
      holidayPending.set(key, promise);
      promise.finally(() => holidayPending.delete(key));
      return promise;
    }
    function isFestiu(d) { return getHolidaysSync(d.getFullYear()).has(isoOf(d)); }
    function setHolidayMunicipality(name) {
      if (!name || normName(name) === normName(holidayMunicipality)) return;
      holidayMunicipality = name;
      renderCalendar();
      loadHolidays(new Date().getFullYear()).then(() => { lastDateKey = ''; renderCalendar(); });
    }

    // =================================================================
    //  FASE LUNAR — algorisme de Jean Meeus (Astronomical Algorithms,
    //  cap. 49) amb els termes principals: error d'uns pocs minuts.
    //  phase: 0 nova, 0.25 quart creixent, 0.5 plena, 0.75 quart minvant
    // =================================================================
    function moonPhaseJDE(k) {
      const T = k / 1236.85, rad = Math.PI / 180;
      let jde = 2451550.09766 + 29.530588861 * k + 0.00015437 * T * T;
      const E = 1 - 0.002516 * T;
      const Ms = (2.5534 + 29.1053567 * k) * rad;
      const Mm = (201.5643 + 385.81693528 * k + 0.0107582 * T * T) * rad;
      const F = (160.7108 + 390.67050284 * k) * rad;
      const f = ((k % 1) + 1) % 1;
      const s = Math.sin;
      if (f < 0.01 || f > 0.99) {
        jde += -0.4072 * s(Mm) + 0.17241 * E * s(Ms) + 0.01608 * s(2 * Mm) + 0.01039 * s(2 * F)
             + 0.00739 * E * s(Mm - Ms) - 0.00514 * E * s(Mm + Ms) + 0.00208 * E * E * s(2 * Ms) - 0.00111 * s(Mm - 2 * F);
      } else if (Math.abs(f - 0.5) < 0.01) {
        jde += -0.40614 * s(Mm) + 0.17302 * E * s(Ms) + 0.01614 * s(2 * Mm) + 0.01043 * s(2 * F)
             + 0.00734 * E * s(Mm - Ms) - 0.00515 * E * s(Mm + Ms) + 0.00209 * E * E * s(2 * Ms) - 0.00111 * s(Mm - 2 * F);
      } else {
        jde += -0.62801 * s(Mm) + 0.17172 * E * s(Ms) - 0.01183 * E * s(Mm + Ms) + 0.00862 * s(2 * Mm)
             + 0.00804 * s(2 * F) + 0.00454 * E * s(Mm - Ms) + 0.00204 * E * E * s(2 * Ms) - 0.0018 * s(Mm - 2 * F);
        const W = 0.00306 - 0.00038 * E * Math.cos(Ms) + 0.00026 * Math.cos(Mm) - 0.00002 * Math.cos(Mm - Ms)
                + 0.00002 * Math.cos(Mm + Ms) + 0.00002 * Math.cos(2 * F);
        jde += f < 0.5 ? W : -W;
      }
      return jde;
    }
    function jdeToDate(jde) { return new Date((jde - 2440587.5) * 864e5 - 69e3); }
    function kAround(date) { return Math.floor((date.getTime() - Date.UTC(2000, 0, 6, 18, 14)) / (29.530588861 * 864e5)); }
    function moonState(date) {
      let k = kAround(date);
      let prev = jdeToDate(moonPhaseJDE(k));
      if (prev > date) { k -= 1; prev = jdeToDate(moonPhaseJDE(k)); }
      let next = jdeToDate(moonPhaseJDE(k + 1));
      if (next <= date) { k += 1; prev = next; next = jdeToDate(moonPhaseJDE(k + 1)); }
      const p = (date - prev) / (next - prev);
      const age = (date - prev) / 864e5;
      const illum = (1 - Math.cos(2 * Math.PI * p)) / 2;
      let full = jdeToDate(moonPhaseJDE(k + 0.5));
      if (full <= date) full = jdeToDate(moonPhaseJDE(k + 1.5));
      return { p, age, illum, nextFull: full, nextNew: next };
    }
    function moonPhaseName(p) {
      if (p < 0.033 || p >= 0.967) return 'Lluna nova';
      if (p < 0.216) return 'Creixent';
      if (p < 0.284) return 'Quart creixent';
      if (p < 0.466) return 'Gibosa creixent';
      if (p < 0.534) return 'Lluna plena';
      if (p < 0.716) return 'Gibosa minvant';
      if (p < 0.784) return 'Quart minvant';
      return 'Minvant';
    }
    // Esdeveniments lunars principals d'un mes (data local → símbol)
    function moonEventsOfMonth(year, month) {
      const res = {};
      const start = new Date(year, month, 1);
      const k0 = kAround(start) - 1;
      const kinds = [[0, '●', 'Lluna nova'], [0.25, '◐', 'Quart creixent'], [0.5, '○', 'Lluna plena'], [0.75, '◑', 'Quart minvant']];
      for (let k = k0; k <= k0 + 3; k++) {
        kinds.forEach(([f, sym, name]) => {
          const d = jdeToDate(moonPhaseJDE(k + f));
          if (d.getFullYear() === year && d.getMonth() === month) {
            const ev = { sym, name, at: d };
            if (f === 0.5) {
              const kind = fullMoonKind(d);
              if (kind === 'super') { ev.name = 'Superlluna plena'; ev.special = true; }
              if (kind === 'micro') ev.name = 'Microlluna plena';
              ev.km = Math.round(moonDistanceKm(d));
            }
            res[isoOf(d)] = ev;
          }
        });
      }
      return res;
    }

    // Distància Terra–Lluna (Meeus cap. 47, termes principals, error < ~200 km)
    function moonDistanceKm(date) {
      const T = (date.getTime() / 864e5 + 2440587.5 - 2451545) / 36525, r = Math.PI / 180;
      const D = (297.8501921 + 445267.1114034 * T) * r, Ms = (357.5291092 + 35999.0502909 * T) * r;
      const Mm = (134.9633964 + 477198.8675055 * T) * r, F = (93.272095 + 483202.0175233 * T) * r;
      const E = 1 - 0.002516 * T, c = Math.cos;
      const sum = -20905355 * c(Mm) - 3699111 * c(2 * D - Mm) - 2955968 * c(2 * D) - 569925 * c(2 * Mm)
        + 48888 * E * c(Ms) - 3149 * c(2 * F) + 246158 * c(2 * D - 2 * Mm) - 152138 * E * c(2 * D - Ms - Mm)
        - 170733 * c(2 * D + Mm) - 204586 * E * c(2 * D - Ms) - 129620 * E * c(Ms - Mm) + 108743 * c(D)
        + 104755 * E * c(Ms + Mm) + 10321 * c(2 * D - 2 * F) + 79661 * c(Mm - 2 * F) - 34782 * c(4 * D - Mm);
      return 385000.56 + sum / 1000;
    }
    // Superlluna: lluna plena a menys de ~361.500 km (≈90 % del perigeu). Microlluna: > 405.000 km
    function fullMoonKind(at) {
      const d = moonDistanceKm(at);
      return d < 361500 ? 'super' : d > 405000 ? 'micro' : null;
    }
    // Eclipsis 2026–2030 (NASA GSFC). Lunars amb l'hora UTC del màxim; solars, data aproximada.
    const ECLIPSES = [
      ['2026-02-17T12:12Z', 'sol', 'Eclipsi anular de Sol', 'Antàrtida'],
      ['2026-03-03T11:34Z', 'lluna', 'Eclipsi total de Lluna', 'no visible a Europa'],
      ['2026-08-12T17:46Z', 'sol', 'Eclipsi total de Sol', 'total al nord i est de la Península, gairebé total a Barcelona'],
      ['2026-08-28T04:13Z', 'lluna', 'Eclipsi parcial de Lluna', 'visible a Europa'],
      ['2027-02-06T16:00Z', 'sol', 'Eclipsi anular de Sol', 'Sud-amèrica i Àfrica'],
      ['2027-02-20T23:13Z', 'lluna', 'Eclipsi penombral de Lluna', 'visible a Europa'],
      ['2027-07-18T16:03Z', 'lluna', 'Eclipsi penombral de Lluna', 'Àsia i Pacífic'],
      ['2027-08-02T10:07Z', 'sol', 'Eclipsi total de Sol', 'total al sud de la Península, parcial a Barcelona'],
      ['2027-08-17T07:14Z', 'lluna', 'Eclipsi penombral de Lluna', 'Amèrica i Pacífic'],
      ['2028-01-12T04:13Z', 'lluna', 'Eclipsi parcial de Lluna', 'visible a Europa'],
      ['2028-01-26T15:08Z', 'sol', 'Eclipsi anular de Sol', 'anular a Portugal i Espanya'],
      ['2028-07-06T18:19Z', 'lluna', 'Eclipsi parcial de Lluna', 'visible a Europa'],
      ['2028-07-22T02:56Z', 'sol', 'Eclipsi total de Sol', 'Austràlia i Nova Zelanda'],
      ['2028-12-31T16:52Z', 'lluna', 'Eclipsi total de Lluna', 'visible a Europa'],
      ['2029-01-14T17:13Z', 'sol', 'Eclipsi parcial de Sol', 'Amèrica del Nord'],
      ['2029-06-12T04:06Z', 'sol', 'Eclipsi parcial de Sol', 'Àrtic'],
      ['2029-06-26T03:22Z', 'lluna', 'Eclipsi total de Lluna', 'visible a Europa'],
      ['2029-07-11T15:37Z', 'sol', 'Eclipsi parcial de Sol', 'Sud-amèrica'],
      ['2029-12-05T15:03Z', 'sol', 'Eclipsi parcial de Sol', 'Antàrtida'],
      ['2029-12-20T22:42Z', 'lluna', 'Eclipsi total de Lluna', 'visible a Europa'],
      ['2030-06-01T06:29Z', 'sol', 'Eclipsi anular de Sol', 'parcial al sud d\'Europa'],
      ['2030-06-15T18:33Z', 'lluna', 'Eclipsi parcial de Lluna', 'visible a Europa'],
      ['2030-11-25T06:51Z', 'sol', 'Eclipsi total de Sol', 'Àfrica austral i Austràlia'],
      ['2030-12-09T22:28Z', 'lluna', 'Eclipsi penombral de Lluna', 'visible a Europa']
    ].map(([t, body, name, where]) => ({ at: new Date(t), body, name, where }));
    function eclipseOn(iso) { return ECLIPSES.find(e => isoOf(e.at) === iso); }
    function nextEclipse(from) { return ECLIPSES.find(e => e.at >= from); }

    let southern = false;
    function updateMoonDial(now) {
      const ms = moonState(now);
      // El disc porta dues llunes: mig gir per lunació
      const angle = ms.p * 180;
      $('m-moon-disc').setAttribute('transform', `rotate(${angle.toFixed(3)} ${M.c6[0]} ${M.c6[1]})`);
      $('m-moon-mirror').setAttribute('transform', southern ? 'translate(200 0) scale(-1 1)' : '');
      $('data-moon').textContent = `${moonPhaseName(ms.p)} ${Math.round(ms.illum * 100)}%`;
      const f = ms.nextFull;
      $('data-fullmoon').textContent = `${f.getDate()}/${f.getMonth() + 1} ${pad2(f.getHours())}:${pad2(f.getMinutes())}` + (fullMoonKind(f) === 'super' ? ' ★' : '');
      $('data-fullmoon').parentElement.title = fullMoonKind(f) === 'super' ? 'Superlluna' : '';
      $('data-moondist').textContent = `${Math.round(moonDistanceKm(now)).toLocaleString('ca-ES')} km`;
      const ne = nextEclipse(now);
      $('data-eclipse').textContent = ne ? `${ne.at.getDate()}/${ne.at.getMonth() + 1}/${String(ne.at.getFullYear()).slice(2)} ${ne.body === 'sol' ? '☉' : '☾'}` : '—';
      $('data-eclipse').parentElement.title = ne ? `${ne.name} · ${ne.where}` : '';
    }

    // =================================================================
    //  CRONÒGRAFS: estat independent per esfera, persistent entre visites
    // =================================================================
    const BEATS = 8; // 28.800 alternances/hora → 8 salts per segon
    const CHRONO_KEY = 'malv_giul_chrono_v1';
    function loadChronos() {
      try { const s = JSON.parse(localStorage.getItem(CHRONO_KEY)); if (s && s.m && s.g) return s; } catch (e) {}
      return { m: { acc: 0, start: 0, running: false }, g: { acc: 0, start: 0, running: false } };
    }
    const chronos = loadChronos();
    function saveChronos() { try { localStorage.setItem(CHRONO_KEY, JSON.stringify(chronos)); } catch (e) {} }
    function elapsed(c, now) { return c.acc + (c.running ? now - c.start : 0); }
    const snaps = { m: null, g: null }; // animació de tornada a zero (cor/heart-cam)

    function chronoAngles(w, e) {
      const q = Math.floor(e / (1000 / BEATS)) * (1000 / BEATS);
      const sec = (q / 1000 % 60) * 6;
      if (w === 'm') {
        return { sec, min: (e / 60000 % 30) * 12, hr: (e / 3600000 % 12) * 30 };
      }
      return { sec, min: (Math.floor(e / 60000) % 30) * 12 };
    }

    // Àudio: clic mecànic curt quan es prem un polsador
    let audioCtx = null;
    function click(strong) {
      try {
        audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
        const len = Math.floor(audioCtx.sampleRate * 0.025);
        const buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
        const d = buf.getChannelData(0);
        for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 6);
        const src = audioCtx.createBufferSource();
        const g = audioCtx.createGain();
        const f = audioCtx.createBiquadFilter();
        f.type = 'highpass'; f.frequency.value = strong ? 1500 : 2600;
        g.gain.value = strong ? 0.5 : 0.3;
        src.buffer = buf; src.connect(f); f.connect(g); g.connect(audioCtx.destination); src.start();
      } catch (e) {}
      if (navigator.vibrate) navigator.vibrate(strong ? 18 : 10);
    }

    function pressVisual(w, act) {
      const btn = document.querySelector(`.pusher[data-watch="${w}"][data-act="${act}"]`);
      if (!btn) return;
      btn.classList.add('pressed');
      setTimeout(() => btn.classList.remove('pressed'), 140);
    }

    // Tornada a zero harmònica: totes les agulles del crono hi arriben alhora,
    // amb un moviment sinusoidal (arrencada i frenada suaus) i pel camí més curt.
    // La durada creix amb el recorregut més llarg (0,5–1,2 s).
    function angDist(from, to) { return ((to - from) % 360 + 540) % 360 - 180; }
    function startSnap(w, now) {
      const a = chronoAngles(w, elapsed(chronos[w], now));
      const longest = Math.max(...Object.values(a).map(v => Math.abs(angDist(v, 0))));
      snaps[w] = { t0: performance.now(), from: a, dur: 500 + 700 * longest / 180 };
    }

    function chronoAction(w, act) {
      const c = chronos[w], now = Date.now();
      pressVisual(w, act);
      if (act === 'start') {
        if (c.running) { c.acc += now - c.start; c.running = false; }
        else { c.start = now; c.running = true; }
        click(false);
      } else {
        if (!c.running) {
          if (c.acc === 0) return;
          startSnap(w, now);
          c.acc = 0;
          c.laps = 0;
          click(true);
        } else if (w === 'g') {
          // LAP/0 (flyback): desa la volta, torna a zero i rearrenca sense aturar
          const lap = elapsed(c, now);
          c.laps = (c.laps || 0) + 1;
          startSnap(w, now);
          c.acc = 0; c.start = now;
          flashExtra(`V${c.laps} ${fmt(lap)}`, 3000);
          click(true);
        } else {
          // El 7751 no permet posar a zero en marxa: el polsador queda bloquejat
          click(false);
          flashExtra('Atura primer', 1500);
          return;
        }
      }
      saveChronos();
    }

    // =================================================================
    //  BUCLE PRINCIPAL D'AGULLES
    // =================================================================
    const R = (id, a, cx = 100, cy = 100) => $(id).setAttribute('transform', `rotate(${a.toFixed(3)} ${cx} ${cy})`);
    let lastStep = -1;
    let lastDateKey = '';

    // L'agulla de la data avança suaument quan s'ajusta des del calendari
    const datePointer = { cur: new Date().getDate(), target: new Date().getDate() };
    setInterval(() => {
      datePointer.target = displayDate(new Date()).getDate();
      const diff = datePointer.target - datePointer.cur;
      if (Math.abs(diff) < 0.02) datePointer.cur = datePointer.target;
      else datePointer.cur += diff * 0.18;
    }, 30);

    function frame() {
      const nowD = new Date();
      const now = nowD.getTime();
      const ms = nowD.getMilliseconds();
      const step = Math.floor(now / (1000 / BEATS));

      if (step !== lastStep || snaps.m || snaps.g) {
        lastStep = step;
        const sQ = nowD.getSeconds() + Math.floor(ms * BEATS / 1000) / BEATS;
        const min = nowD.getMinutes() + (nowD.getSeconds() + ms / 1000) / 60;
        const hr = (nowD.getHours() % 12) + min / 60;
        const h24 = nowD.getHours() + min / 60;

        // Hora
        R('m-hour', hr * 30); R('m-minute', min * 6);
        R('g-hour', hr * 30); R('g-minute', min * 6);
        R('m-ssec', sQ * 6, ...M.c9);
        R('m-h24', h24 * 15, ...M.c9);
        R('g-ssec', sQ * 6, ...G.c9);
        R('m-date-hand', datePointer.cur / 31 * 360);

        // Cronògrafs
        ['m', 'g'].forEach(w => {
          const a = chronoAngles(w, elapsed(chronos[w], now));
          const sn = snaps[w];
          let A = a;
          if (sn) {
            const t = Math.min(1, (performance.now() - sn.t0) / sn.dur);
            const k = (1 - Math.cos(Math.PI * t)) / 2;
            // la destinació és la posició viva: en un LAP/0 en marxa, l'agulla
            // enllaça amb el nou compte sense cap salt
            const go = key => sn.from[key] + angDist(sn.from[key], a[key]) * k;
            A = { sec: go('sec'), min: go('min'), hr: sn.from.hr !== undefined ? go('hr') : 0 };
            if (t >= 1) snaps[w] = null;
          }
          if (w === 'm') { R('m-csec', A.sec); R('m-cmin', A.min, ...M.c12); R('m-chr', A.hr, ...M.c6); }
          else { R('g-csec', A.sec); R('g-cmin', A.min, ...G.c3); }
        });

        updateChronoBar(now);
        checkDateChange(nowD);
      }
      requestAnimationFrame(frame);
    }

    // =================================================================
    //  COMPLICACIONS DE CALENDARI (canvien un cop al dia)
    // =================================================================
    let bigDatePrev = null;
    function rollDisc(g, from, to, wrapIndex, animate) {
      const H = 16;
      if (!animate || from === null || from === to) {
        g.style.transition = 'none';
        g.style.transform = `translateY(${-to * H}px)`;
        g.getBoundingClientRect();
        g.style.transition = '';
        return;
      }
      const target = to < from ? wrapIndex : to; // sempre endavant, com un disc real
      g.style.transform = `translateY(${-target * H}px)`;
      if (target !== to) {
        setTimeout(() => {
          g.style.transition = 'none';
          g.style.transform = `translateY(${-to * H}px)`;
          g.getBoundingClientRect();
          g.style.transition = '';
        }, 750);
      }
    }

    function refreshCalendarComplications(d) {
      const sat = d.getDay() === 6 && !isFestiu(d);
      const dayEl = $('m-day');
      dayEl.textContent = WINDOW_TEXT[windowLang].d[d.getDay()];
      const hol = isFestiu(d), sun = d.getDay() === 0 && !hol;
      dayEl.classList.toggle('festiu', hol);
      dayEl.classList.toggle('diumenge', sun);
      dayEl.classList.toggle('dissabte', sat);
      $('m-month').textContent = WINDOW_TEXT[windowLang].m[d.getMonth()];

      // Escala 1–31: festius en blau marí amb un punt; diumenges en burdeus
      const y = d.getFullYear(), m = d.getMonth();
      const last = new Date(y, m + 1, 0).getDate();
      for (let n = 1; n <= 31; n++) {
        const t = $('m-dnum-' + n);
        const dd = new Date(y, m, n);
        const isHol = n <= last && isFestiu(dd);
        t.classList.toggle('festiu', isHol);
        t.classList.toggle('diumenge', n <= last && !isHol && dd.getDay() === 0);
        $('m-hdot-' + n).classList.toggle('on', isHol);
        t.setAttribute('opacity', n <= last ? '1' : '0.35');
      }

      // Gran data
      const date = d.getDate();
      const tens = Math.floor(date / 10), units = date % 10;
      const prev = bigDatePrev;
      rollDisc($('g-tens'), prev ? prev.t : null, tens, 4, !!prev);
      rollDisc($('g-units'), prev ? prev.u : null, units, 10, !!prev);
      bigDatePrev = { t: tens, u: units };
      // Giulietta: diumenges i festius en burdeus a la finestra de la gran data
      document.querySelectorAll('#g-tens text, #g-units text').forEach(t => {
        t.classList.remove('festiu');
        t.classList.toggle('diumenge', hol || sun);
        t.classList.toggle('dissabte', sat);
      });

      updateMoonDial(d);
      updateNextHoliday(new Date());
    }

    // Data que mostren les complicacions: la real o una data "ajustada" des del calendari
    let setDateIso = null;
    function displayDate(now) {
      if (!setDateIso) return now;
      const [y, m, d] = setDateIso.split('-').map(Number);
      return new Date(y, m - 1, d, now.getHours(), now.getMinutes(), now.getSeconds());
    }
    function checkDateChange(d) {
      const shown = displayDate(d);
      const key = isoOf(shown) + windowLang;
      if (key !== lastDateKey) { lastDateKey = key; refreshCalendarComplications(shown); }
    }
    function setWatchDate(iso) {
      setDateIso = (iso && iso !== isoOf(new Date())) ? iso : null;
      lastDateKey = '';
      document.querySelectorAll('.calendar-day-cell.watch-set').forEach(c => c.classList.remove('watch-set'));
      if (setDateIso) { const c = document.querySelector(`.calendar-day-cell[data-iso="${setDateIso}"]`); if (c) c.classList.add('watch-set'); }
    }

    function updateNextHoliday(d) {
      const set = new Set([...getHolidaysSync(d.getFullYear()), ...getHolidaysSync(d.getFullYear() + 1)]);
      const today = isoOf(d);
      const next = [...set].filter(x => x >= today).sort()[0];
      if (!next) { $('data-holiday').textContent = '—'; return; }
      const [, mm, dd] = next.split('-');
      $('data-holiday').textContent = `${+dd}/${+mm}`;
      $('data-holiday').parentElement.title = holidayName(next);
    }

    // =================================================================
    //  BARRA DEL CRONÒGRAF
    // =================================================================
    let visible = 'm';
    let extraFlash = null;
    function fmt(e) {
      const ds = Math.floor(e / 100) % 10, s = Math.floor(e / 1000) % 60, m = Math.floor(e / 60000) % 60, h = Math.floor(e / 3600000);
      return `${pad2(h)}:${pad2(m)}:${pad2(s)},${ds}`;
    }
    function flashExtra(msg, ms) { extraFlash = { msg, until: Date.now() + (ms || 2600) }; }
    function updateChronoBar(now) {
      const c = chronos[visible];
      const e = elapsed(c, now);
      // La volta (LAP/0) es mostra uns segons al mateix lloc del temps
      const flashing = extraFlash && extraFlash.until > now;
      $('chrono-time').textContent = flashing ? extraFlash.msg : fmt(e);
      $('chrono-time').classList.toggle('flash', !!flashing);
      const bs = $('btn-start');
      bs.textContent = c.running ? 'Stop' : 'Start';
      bs.classList.toggle('on', c.running);
      $('btn-reset').textContent = visible === 'g' ? 'LAP/0' : 'Zero';
    }

    // =================================================================
    //  GIR 3D AMB CILINDRE D'ACER
    // =================================================================
    const watchFlip = $('watchFlip');
    const faceM = $('face-m'), faceG = $('face-g');
    let turns = 0;
    // ---------------------------------------------------------------
    //  Gir del cos sòlid. Projecció del cilindre (eix vertical):
    //   · la cara visible s'estreny amb |cos θ| i es desplaça T·sin θ
    //   · la cara oculta és una el·lipse d'acer al costat contrari
    //   · entre totes dues, una banda d'acer de 2·T·|sin θ| (el gruix)
    //  Mateixa durada i corba que l'original (5 s, cubic-bezier .45,.05,.55,.95),
    //  sempre en el mateix sentit.
    // ---------------------------------------------------------------
    const bodyEllipse = $('body-ellipse'), bodyBand = $('body-band');
    const watchShadow = document.querySelector('.watch-shadow');
    [faceM, faceG].forEach(f => { const sh = document.createElement('div'); sh.className = 'face-shade'; f.appendChild(sh); });
    const shadeM = faceM.querySelector('.face-shade'), shadeG = faceG.querySelector('.face-shade');
    let halfT = 12, theta = 0, flipAnim = null;
    function buildEdge() {
      const S = watchFlip.offsetWidth || 300;
      halfT = Math.max(8, Math.round(S * 0.06));     // mig gruix de la caixa
      renderFlip(theta);
    }
    function cubicBezier(x1, y1, x2, y2) {
      const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx;
      const cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
      const X = t => ((ax * t + bx) * t + cx) * t, Y = t => ((ay * t + by) * t + cy) * t;
      return x => { let t = x; for (let i = 0; i < 6; i++) { const d = (3 * ax * t + 2 * bx) * t + cx; if (Math.abs(d) < 1e-6) break; t -= (X(t) - x) / d; } return Y(Math.min(1, Math.max(0, t))); };
    }
    const flipEase = cubicBezier(.45, .05, .55, .95);
    function renderFlip(th) {
      const c = Math.cos(th), sn = Math.sin(th);
      const sx = Math.max(Math.abs(c), 0.001);
      const front = c >= 0;                          // cara MALVINES cap a nosaltres
      const show = front ? faceM : faceG, hide = front ? faceG : faceM;
      const dx = halfT * sn;                         // desplaçament del centre de la cara visible
      show.classList.remove('hidden-face');
      hide.classList.add('hidden-face');
      show.style.transform = `translateX(${(front ? dx : -dx).toFixed(2)}px) scaleX(${sx.toFixed(4)})`;
      (front ? shadeM : shadeG).style.opacity = (1 - sx).toFixed(3);
      // L'ombra segueix l'amplada real de la silueta (cara + gruix)
      const S = watchFlip.offsetWidth || 300;
      watchShadow.style.transform = `scaleX(${Math.min(1, sx + 2 * halfT * Math.abs(sn) / S).toFixed(4)})`;
      const edgeOn = Math.abs(sn) > 0.002;
      bodyEllipse.style.visibility = bodyBand.style.visibility = edgeOn ? 'visible' : 'hidden';
      if (edgeOn) {
        bodyEllipse.style.transform = `translateX(${(front ? -dx : dx).toFixed(2)}px) scaleX(${sx.toFixed(4)})`;
        bodyBand.style.transform = `scaleX(${(halfT * Math.abs(sn)).toFixed(3)})`;
      }
    }
    function flip() {
      turns += 1;
      const from = theta, to = turns * Math.PI;
      const dur = parseFloat(getComputedStyle(watchFlip).getPropertyValue('--flip-ms')) || 5000;
      const t0 = performance.now();
      flipAnim = { from, to, t0, dur };
      watchFlip.classList.add('flipping');
      visible = turns % 2 === 0 ? 'm' : 'g';
      faceM.classList.toggle('inactive', visible !== 'm');
      faceG.classList.toggle('inactive', visible !== 'g');
      updateChronoBar(Date.now());
      const tick = now => {
        if (!flipAnim || flipAnim.t0 !== t0) return;   // un gir nou ha substituït aquest
        const p = Math.min(1, (now - t0) / dur);
        theta = from + (to - from) * flipEase(p);
        renderFlip(theta);
        if (p < 1) requestAnimationFrame(tick); else { flipAnim = null; watchFlip.classList.remove('flipping'); }
      };
      requestAnimationFrame(tick);
    }
    function flipInstant() {
      turns += 1; theta = turns * Math.PI;
      visible = turns % 2 === 0 ? 'm' : 'g';
      faceM.classList.toggle('inactive', visible !== 'm');
      faceG.classList.toggle('inactive', visible !== 'g');
      renderFlip(theta);
    }
    watchFlip.addEventListener('click', flip);
    document.querySelectorAll('.pusher').forEach(b => {
      b.addEventListener('click', e => { e.stopPropagation(); chronoAction(b.dataset.watch, b.dataset.act); });
    });
    $('btn-start').addEventListener('click', () => chronoAction(visible, 'start'));
    $('btn-reset').addEventListener('click', () => chronoAction(visible, 'reset'));
    $('btn-flip').addEventListener('click', flip);
    document.addEventListener('keydown', e => {
      if (e.target.closest && e.target.closest('input, textarea')) return;
      if (e.code === 'Space') { e.preventDefault(); chronoAction(visible, 'start'); }
      else if (e.key === 'r' || e.key === 'R') chronoAction(visible, 'reset');
      else if (e.key === 'f' || e.key === 'F') flip();
    });
    let resizeT;
    window.addEventListener('resize', () => { clearTimeout(resizeT); resizeT = setTimeout(buildEdge, 150); });
    buildEdge();
    // En engegar, apareix una de les dues esferes a l'atzar (sense animació)
    if (Math.random() < 0.5) flipInstant();

    // =================================================================
    //  CALENDARI MENSUAL
    // =================================================================
    let calendarMonthOffset = 0, calendarRenderToken = 0, selectedIso = null;

    function makeDayCell(text, extraClass) {
      const cell = document.createElement('div');
      cell.className = extraClass ? `calendar-day-cell ${extraClass}` : 'calendar-day-cell';
      cell.textContent = text;
      return cell;
    }

    function showDayInfo(iso) {
      if (!$('day-info')) return;   // línia d'informació retirada (el nom del festiu queda al títol del dia)
      const [y, m, d] = iso.split('-').map(Number);
      const date = new Date(y, m - 1, d, 12);
      const parts = [`<b>${dayNamesCa[date.getDay()]} ${d} ${deMes(m - 1)}</b>`];
      if (getHolidaysSync(y).has(iso)) parts.push(`${iso.slice(5) === HOMAGE_MMDD ? '🎗️' : '🔴'} ${holidayName(iso)}`);
      const ev = moonEventsOfMonth(y, m - 1)[iso];
      if (ev) parts.push(`${ev.sym} ${ev.name} a les ${pad2(ev.at.getHours())}:${pad2(ev.at.getMinutes())}` + (ev.km ? ` (${ev.km.toLocaleString('ca-ES')} km)` : ''));
      else { const s = moonState(date); parts.push(`${moonPhaseName(s.p)} (${Math.round(s.illum * 100)}%)`); }
      const ecl = eclipseOn(iso);
      if (ecl) parts.push(`${ecl.body === 'sol' ? '☉' : '◉'} ${ecl.name}` + (ecl.body === 'lluna' ? ` a les ${pad2(ecl.at.getHours())}:${pad2(ecl.at.getMinutes())}` : '') + ` — ${ecl.where}`);
      let html = parts.join(' · ');
      if (setDateIso === iso) html += '<span class="set-note">⌚ Rellotge ajustat a aquest dia · toca «Avui» per tornar al temps real</span>';
      $('day-info').innerHTML = html;
    }

    async function renderCalendar() {
      const token = ++calendarRenderToken;
      const real = new Date();
      const target = new Date(real.getFullYear(), real.getMonth() + calendarMonthOffset, 1);
      const year = target.getFullYear(), month = target.getMonth();
      const isCurrentMonth = year === real.getFullYear() && month === real.getMonth();
      const holidays = await loadHolidays(year);
      if (token !== calendarRenderToken) return;
      const moonEv = moonEventsOfMonth(year, month);

      const frag = document.createDocumentFragment();
      let startingDay = new Date(year, month, 1).getDay() - 1;
      if (startingDay === -1) startingDay = 6;
      const lastDate = new Date(year, month + 1, 0).getDate();
      const prevLast = new Date(year, month, 0).getDate();
      for (let i = 0; i < startingDay; i++) frag.appendChild(makeDayCell(prevLast - startingDay + 1 + i, 'other-month'));
      for (let day = 1; day <= lastDate; day++) {
        const iso = `${year}-${pad2(month + 1)}-${pad2(day)}`;
        const cell = makeDayCell(day);
        cell.dataset.iso = iso;
        const dow = new Date(year, month, day).getDay();
        if (dow === 0 || dow === 6) cell.classList.add('weekend');
        if (holidays.has(iso)) { cell.classList.add('holiday'); cell.title = holidayName(iso); }
        if (iso.slice(5) === HOMAGE_MMDD) cell.classList.add('homage');
        if (iso === setDateIso) cell.classList.add('watch-set');
        if (isCurrentMonth && day === real.getDate()) cell.classList.add('today');
        if (iso === selectedIso) cell.classList.add('selected');
        const ecl = eclipseOn(iso);
        if (moonEv[iso] || ecl) {
          const mk = document.createElement('span');
          mk.className = 'moon-mark' + ((ecl || (moonEv[iso] && moonEv[iso].special)) ? ' special' : '');
          mk.textContent = ecl ? (ecl.body === 'sol' ? '☉' : '◉') : moonEv[iso].sym;
          cell.appendChild(mk);
        }
        frag.appendChild(cell);
      }
      for (let i = startingDay + lastDate, next = 1; i < 42; i++, next++) frag.appendChild(makeDayCell(next, 'other-month'));
      $('month-year-title').textContent = `${monthNames[month]} ${year}`;
      $('days-container').replaceChildren(frag);
      if (!selectedIso) showDayInfo(isoOf(real));
    }

    $('days-container').addEventListener('click', e => {
      const cell = e.target.closest('.calendar-day-cell');
      if (!cell || !cell.dataset.iso) return;
      selectedIso = cell.dataset.iso;
      document.querySelectorAll('.calendar-day-cell.selected').forEach(c => c.classList.remove('selected'));
      cell.classList.add('selected');
      setWatchDate(selectedIso);   // com qui ajusta la corona: les complicacions salten a aquest dia
      showDayInfo(selectedIso);
    });

    function animateToMonth(newOffset, direction) {
      if (newOffset === calendarMonthOffset) return;
      const daysContainer = $('days-container'), titleEl = $('month-year-title');
      const outD = direction > 0 ? '-14px' : '14px', inD = direction > 0 ? '14px' : '-14px';
      [daysContainer, titleEl].forEach(el => { el.style.transition = 'transform 0.16s ease, opacity 0.16s ease'; el.style.transform = `translateX(${outD})`; el.style.opacity = '0'; });
      calendarMonthOffset = newOffset;
      setTimeout(async () => {
        await renderCalendar();
        [daysContainer, titleEl].forEach(el => { el.style.transition = 'none'; el.style.transform = `translateX(${inD})`; });
        requestAnimationFrame(() => [daysContainer, titleEl].forEach(el => {
          el.style.transition = 'transform 0.16s ease, opacity 0.16s ease'; el.style.transform = 'translateX(0)'; el.style.opacity = '1';
        }));
      }, 160);
    }
    const shiftCalendarMonth = dir => animateToMonth(calendarMonthOffset + dir, dir);
    function goToCurrentMonth() {
      selectedIso = null;
      setWatchDate(null);
      if (calendarMonthOffset === 0) { renderCalendar(); return; }
      animateToMonth(0, calendarMonthOffset > 0 ? -1 : 1);
    }
    $('prev-month').addEventListener('click', e => { e.stopPropagation(); shiftCalendarMonth(-1); });
    $('next-month').addEventListener('click', e => { e.stopPropagation(); shiftCalendarMonth(1); });
    $('calendar-today-btn').addEventListener('click', e => { e.stopPropagation(); goToCurrentMonth(); });
    $('month-year-title').addEventListener('dblclick', goToCurrentMonth);

    (function setupSwipe() {
      const target = document.querySelector('.calendar-section');
      let sx = 0, sy = 0, tracking = false;
      const onStart = (x, y, t) => { if (t && t.closest && (t.closest('.data-panel') || t.closest('button'))) { tracking = false; return; } sx = x; sy = y; tracking = true; };
      const onEnd = (x, y) => {
        if (!tracking) return; tracking = false;
        const dx = x - sx, dy = y - sy;
        if (Math.abs(dx) < 40 || Math.abs(dx) < Math.abs(dy)) return;
        shiftCalendarMonth(dx < 0 ? 1 : -1);
      };
      target.addEventListener('touchstart', e => { const t = e.changedTouches[0]; onStart(t.clientX, t.clientY, e.target); }, { passive: true });
      target.addEventListener('touchend', e => { const t = e.changedTouches[0]; onEnd(t.clientX, t.clientY); }, { passive: true });
      target.addEventListener('mousedown', e => onStart(e.clientX, e.clientY, e.target));
      target.addEventListener('mouseup', e => onEnd(e.clientX, e.clientY));
      // Doble toc al títol (iOS no sempre envia dblclick)
      let last = 0;
      $('month-year-title').addEventListener('touchend', e => {
        const n = Date.now();
        if (n - last < 350) { e.preventDefault(); goToCurrentMonth(); last = 0; } else last = n;
      });
    })();

    // =================================================================
    //  TEMA DIÜRN / NOCTURN (automàtic amb el sol o fix amb el botó)
    // =================================================================
    const THEME_KEY = 'malv_giul_theme';
    const SUN_ICON = '<svg class="theme-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.55 1.55M17.15 17.15l1.55 1.55M5.3 18.7l1.55-1.55M17.15 6.85l1.55-1.55"/></svg>';
    const MOON_ICON = '<svg class="theme-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.2 14.6A8.4 8.4 0 0 1 9.4 3.8a8.4 8.4 0 1 0 10.8 10.8z"/></svg>';
    let sunTimes = null;
    function getStoredTheme() { try { const v = localStorage.getItem(THEME_KEY); return v === 'day' || v === 'night' ? v : null; } catch (e) { return null; } }
    function setStoredTheme(v) { try { v ? localStorage.setItem(THEME_KEY, v) : localStorage.removeItem(THEME_KEY); } catch (e) {} }
    function autoTheme() {
      const now = new Date();
      if (sunTimes && isoOf(sunTimes.sunrise) === isoOf(now)) return now >= sunTimes.sunrise && now < sunTimes.sunset ? 'day' : 'night';
      const h = now.getHours();
      return h >= 7 && h < 20 ? 'day' : 'night';
    }
    function applyTheme() {
      const stored = getStoredTheme();
      const theme = stored || autoTheme();
      document.documentElement.setAttribute('data-theme', theme);
      document.querySelector('meta[name="theme-color"]').setAttribute('content', theme === 'day' ? '#e6ebf2' : '#0b0d12');
      const btn = $('theme-toggle-btn');
      btn.innerHTML = (theme === 'day' ? SUN_ICON : MOON_ICON) + `<span class="theme-label">${theme === 'day' ? 'Dia' : 'Nit'}</span>` + (stored ? '' : '<span class="theme-auto-badge">A</span>');
      btn.title = stored ? `Tema ${theme === 'day' ? 'diürn' : 'nocturn'} fix (toca per canviar)` : 'Tema automàtic segons el sol (toca per fixar-lo)';
    }
    function cycleTheme() {
      const stored = getStoredTheme(), auto = autoTheme();
      if (!stored) setStoredTheme(auto === 'day' ? 'night' : 'day');
      else if (stored !== auto) setStoredTheme(auto);
      else setStoredTheme(null);
      applyTheme();
    }
    $('theme-toggle-btn').addEventListener('click', e => { e.stopPropagation(); cycleTheme(); });
    // La corona del rellotge també canvia dia/nit (i fixa el tema; el botó del calendari torna a automàtic)
    document.querySelectorAll('.crown').forEach(c => c.addEventListener('click', e => {
      e.stopPropagation();
      const cur = document.documentElement.getAttribute('data-theme');
      setStoredTheme(cur === 'day' ? 'night' : 'day');
      applyTheme();
      click(false);
      c.classList.add('pressed');
      setTimeout(() => c.classList.remove('pressed'), 150);
    }));
    document.addEventListener('keydown', e => { if (e.key === 'n' || e.key === 'N') { const cur = document.documentElement.getAttribute('data-theme'); setStoredTheme(cur === 'day' ? 'night' : 'day'); applyTheme(); } });
    applyTheme();
    setInterval(applyTheme, 60 * 1000);

    // =================================================================
    //  DADES AMBIENTALS (Open-Meteo + BigDataCloud), cada 20 minuts
    // =================================================================
    const FALLBACK = { lat: 41.3874, lon: 2.1686 };
    let currentCoords = null;
    async function getJson(url) { const r = await fetch(url); if (!r.ok) throw new Error(r.status); return r.json(); }
    function precipitationNextHours(w) {
      const h = w.hourly;
      if (!h || !h.time || !h.precipitation_probability) return null;
      const cur = (w.current && w.current.time ? w.current.time : '').slice(0, 13);
      let s = h.time.findIndex(t => t.slice(0, 13) >= cur); if (s < 0) s = 0;
      const e = Math.min(s + 6, h.time.length);
      let max = 0, snow = 0;
      for (let i = s; i < e; i++) { max = Math.max(max, h.precipitation_probability[i] || 0); snow += (h.snowfall && h.snowfall[i]) || 0; }
      return { prob: Math.round(max), type: snow > 0 ? 'neu' : 'pluja' };
    }
    async function refreshWeather(lat, lon) {
      const w = await getJson(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,apparent_temperature&hourly=precipitation_probability,snowfall&daily=sunrise,sunset&forecast_days=2&timezone=auto`).catch(() => null);
      if (!w) return;
      if (w.current) {
        $('data-temp').textContent = `${Math.round(w.current.temperature_2m)}°C`;
        $('data-humidity').textContent = `${Math.round(w.current.relative_humidity_2m)}%`;
        if (w.current.apparent_temperature !== undefined) $('data-feels').textContent = `${Math.round(w.current.apparent_temperature)}°C`;
      }
      const p = precipitationNextHours(w);
      if (p) $('data-precip').textContent = `${p.prob}% ${p.type}`;
      if (w.daily && w.daily.sunrise) {
        sunTimes = { sunrise: new Date(w.daily.sunrise[0]), sunset: new Date(w.daily.sunset[0]) };
        const f = d => `${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
        $('data-sun').textContent = `↑${f(sunTimes.sunrise)} ↓${f(sunTimes.sunset)}`;
        applyTheme();
      }
    }
    async function loadInstrumentData(lat, lon) {
      currentCoords = { lat, lon };
      // Hemisferi sud: la lluna creix pel costat contrari, el disc es mira en mirall
      southern = lat < 0;
      updateMoonDial(displayDate(new Date()));
      const [, elev, loc] = await Promise.all([
        refreshWeather(lat, lon),
        getJson(`https://api.open-meteo.com/v1/elevation?latitude=${lat}&longitude=${lon}`).catch(() => null),
        getJson(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=ca`).catch(() => null)
      ]);
      if (elev && elev.elevation && elev.elevation.length) $('data-altitude').textContent = `${Math.round(elev.elevation[0])} m`;
      if (loc) {
        $('data-location').textContent = loc.city || loc.locality || loc.principalSubdivision || 'Ubicació desconeguda';
        // (els festius es mantenen sempre a Barcelona)
      } else $('data-location').textContent = 'Ubicació desconeguda';
    }
    function initInstrumentData() {
      if (!navigator.geolocation) return loadInstrumentData(FALLBACK.lat, FALLBACK.lon);
      navigator.geolocation.getCurrentPosition(
        p => loadInstrumentData(p.coords.latitude, p.coords.longitude),
        () => loadInstrumentData(FALLBACK.lat, FALLBACK.lon),
        { timeout: 8000 }
      );
    }

    // =================================================================
    //  ARRENCADA
    // =================================================================
    renderCalendar();
    loadHolidays(new Date().getFullYear()).then(() => { lastDateKey = ''; });
    setInterval(renderCalendar, 60 * 60 * 1000);
    (function scheduleMidnight() {
      const n = new Date();
      const next = new Date(n.getFullYear(), n.getMonth(), n.getDate() + 1, 0, 0, 2);
      setTimeout(() => { renderCalendar(); scheduleMidnight(); }, next - n);
    })();
    setInterval(() => updateMoonDial(displayDate(new Date())), 10 * 60 * 1000);
    requestAnimationFrame(frame);
    initInstrumentData();
    setInterval(() => { if (currentCoords) refreshWeather(currentCoords.lat, currentCoords.lon); }, 20 * 60 * 1000);

    // =================================================================
    //  APP (PWA): funcionament sense connexió i pantalla encesa
    // =================================================================
    if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
    }
    // Instal·lada a la pantalla d'inici: manté la pantalla encesa, com un rellotge de taula
    const standalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
    let wakeLock = null;
    async function keepAwake() {
      if (!standalone || !('wakeLock' in navigator) || document.visibilityState !== 'visible') return;
      try { wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {}
    }
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') { keepAwake(); lastDateKey = ''; renderCalendar(); }
    });
    keepAwake();
  </script>
</body>
</html>
