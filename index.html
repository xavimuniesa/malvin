<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Cronògrafs">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="theme-color" content="#0d0f14">
  <title>Cronògrafs MALVINES i Giulietta</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    /* ------------------------------------------------------------------
       TEMES. Nocturn per defecte; el diürn s'activa amb el sol o el botó.
       Les variables --dial-*, --ink-*, --hand-* pinten també l'esfera:
       de dia, plata amb blau d'acer pavonat; de nit, esfera blau nit
       amb numerals i agulles amb lluminescència.
       ------------------------------------------------------------------ */
    :root,
    html[data-theme="night"] {
      --bg: #0b0d12;
      --bg-glow: radial-gradient(ellipse at 30% 40%, #18202e 0%, #0b0d12 60%);
      --text: #f2f2f2;
      --panel-bg: rgba(22, 24, 30, 0.86);
      --panel-border: #2a2d36;
      --weekday-color: #8a8d96;
      --cell-color: #e2e4e8;
      --weekend-color: #8fb4e3;
      --month-title-color: #f2f2f2;
      --data-item-bg: rgba(255, 255, 255, 0.035);
      --data-label-color: #8a8d96;
      --data-value-color: #f2f2f2;
      --muted: #9a9ca5;
      --btn-bg: #23262e;
      --btn-border: #444854;
      --btn-hover-bg: #2f333d;
      --accent: #9cc8ff;
      --today-ring: #9cc8ff;
      --today-ring-glow: rgba(156, 200, 255, 0.7);
      --watch-shadow: 0 18px 34px rgba(0, 0, 0, 0.85);

      --dial-a: #2c374b;
      --dial-b: #1a2232;
      --dial-c: #0c111b;
      --guil: rgba(255, 255, 255, 0.06);
      --sub-a: #222b3c;
      --sub-b: #121926;
      --snail: rgba(255, 255, 255, 0.05);
      --ink-blue: #a6cdff;
      --ink: #c9d1dc;
      --ink-soft: #8d98a8;
      --diumenge: #ec8aa6;   /* burdeus aclarit per a l'esfera fosca */
      --festiu: #cfdcff;     /* blau marí → blau gel sobre l'esfera de nit */
      --dissabte: #8db8ff;
      --hol-a: #4a72d6;
      --hol-b: #1d347c;
      --hol-glow: rgba(74, 114, 214, 0.5);
      --win-bg: #dde1e6;
      --win-ink: #15181d;
      --hand-a: #d6ecff;
      --hand-b: #7fb4f0;
      --hshadow: #000000;
      --hshadow-op: 0.6;
      --glow: #8fc6ff;
      --glow-op: 0.85;
      --crystal-op: 0.05;
    }

    html[data-theme="day"] {
      --bg: #e6ebf2;
      --bg-glow: radial-gradient(ellipse at 30% 40%, #ffffff 0%, #e6ebf2 65%);
      --text: #1b1b1f;
      --panel-bg: rgba(255, 255, 255, 0.86);
      --panel-border: #d3d9e2;
      --weekday-color: #6b6f76;
      --cell-color: #2a2a2e;
      --weekend-color: #2f5fa0;
      --month-title-color: #1b1b1f;
      --data-item-bg: rgba(0, 0, 0, 0.035);
      --data-label-color: #6b6f76;
      --data-value-color: #1b1b1f;
      --muted: #5a5e66;
      --btn-bg: #ffffff;
      --btn-border: #c7cdd6;
      --btn-hover-bg: #eef2f8;
      --accent: #1c3f94;
      --today-ring: #1c3f94;
      --today-ring-glow: rgba(28, 63, 148, 0.35);
      --watch-shadow: 0 14px 26px rgba(30, 40, 60, 0.42);

      --dial-a: #ffffff;
      --dial-b: #eef0ef;
      --dial-c: #cfd3d6;
      --guil: rgba(40, 50, 70, 0.075);
      --sub-a: #f6f7f6;
      --sub-b: #dfe2e3;
      --snail: rgba(0, 0, 0, 0.05);
      --ink-blue: #1a3d96;
      --ink: #24272c;
      --ink-soft: #5b616b;
      --diumenge: #7d1235;   /* burdeus */
      --festiu: #0f2257;     /* blau marí */
      --dissabte: #2e6bd1;   /* blau */
      --hol-a: #3657a8;
      --hol-b: #0f2257;
      --hol-glow: rgba(15, 34, 87, 0.4);
      --win-bg: #ffffff;
      --win-ink: #15181d;
      --hand-a: #0b2470;
      --hand-b: #3366d6;
      --hshadow: #000000;
      --hshadow-op: 0.32;
      --glow: #000000;
      --glow-op: 0;
      --crystal-op: 0.14;
    }

    html, body {
      width: 100%;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow-x: hidden;
      transition: background 0.5s ease, color 0.5s ease;
      -webkit-tap-highlight-color: transparent;
    }

    body { background-image: var(--bg-glow); background-attachment: fixed; }

    /* Mida del rellotge (diàmetre de la caixa). Les anses i els polsadors en surten. */
    :root { --S: clamp(220px, min(calc((100vw - 520px) / 1.22), calc(100dvh - 163px)), 760px); }

    .app-container {
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: row;
      justify-content: center;
      align-items: center;
      padding: 20px;
      padding-top: max(20px, env(safe-area-inset-top));
      padding-bottom: max(20px, env(safe-area-inset-bottom));
      gap: clamp(20px, 4vw, 60px);
    }

    .watch-section {
      width: calc(var(--S) * 1.22);
      flex: 0 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    /* Escenari: reserva l'espai de les anses (a dalt i a baix) i dels polsadors (a la dreta) */
    .watch-stage {
      padding: calc(var(--S) * 0.03) calc(var(--S) * 0.11);
    }

    .watch-flip-wrap { position: relative; }
    /* Ombra fixa (no gira): evita recalcular un filtre sobre l'escena 3D a cada fotograma */
    .watch-shadow {
      position: absolute;
      inset: 2%;
      border-radius: 50%;
      box-shadow: var(--watch-shadow);
      pointer-events: none;
      will-change: transform;
    }

    .watch-container {
      position: relative;
      width: var(--S);
      height: var(--S);
      border-radius: 50%;
      container-type: inline-size;
      cursor: pointer;
    }

    .face {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      will-change: transform;
      transform-origin: 50% 50%;
    }
    .face.hidden-face { visibility: hidden; }
    /* Ombrejat de la cara quan es posa de cantell (només opacitat: barat) */
    .face-shade {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: linear-gradient(90deg, rgba(0,0,0,0.55), rgba(0,0,0,0.15) 60%, rgba(255,255,255,0.08));
      opacity: 0;
      pointer-events: none;
      z-index: 5;
    }
    .face.inactive { pointer-events: none; }

    .dial-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      border-radius: 50%;
      overflow: visible;
    }

    /* Cos sòlid en 2D: la cara oculta (el·lipse d'acer) i la banda del gruix
       es dibuixen com una projecció del cilindre. Només s'escalen i es
       desplacen: el navegador no ha d'ordenar capes en 3D. */
    .body-ellipse, .body-band {
      position: absolute;
      top: 0;
      height: 100%;
      pointer-events: none;
      will-change: transform;
      visibility: hidden;
      background: linear-gradient(180deg, #4a5058 0%, #8d949c 9%, #d9dde1 30%, #f4f6f7 47%, #b9bfc5 62%, #7a8189 86%, #3f454c 100%);
    }
    .body-ellipse { left: 0; width: 100%; border-radius: 50%; }
    .body-band { left: 50%; width: 2px; margin-left: -1px; }
    .body-band::before, .body-band::after {
      content: ''; position: absolute; top: 0; bottom: 0; width: 18%;
      background: rgba(0,0,0,0.22);
    }
    .body-band::before { left: 0; }
    .body-band::after { right: 0; }


    /* Corona i polsadors: col·locats en angle des del centre de la caixa */
    .crown, .pusher {
      position: absolute;
      left: 50%;
      top: 50%;
      z-index: 0;
      border: 0;
      padding: 0;
      appearance: none;
      -webkit-appearance: none;
    }

    .crown {
      cursor: pointer;
      transition: transform 0.12s ease;
      width: 9cqw;
      height: 13cqw;
      transform: translate(-50%, -50%) translateX(52.5cqw);
      border-radius: 1.6cqw;
      background:
        linear-gradient(180deg, rgba(0,0,0,0.35), rgba(255,255,255,0.35) 30%, rgba(255,255,255,0) 55%, rgba(0,0,0,0.35)),
        repeating-linear-gradient(180deg, #e3e6ea 0, #e3e6ea 0.55cqw, #7c838b 0.55cqw, #7c838b 0.95cqw);
      box-shadow: inset -0.6cqw 0 0.8cqw rgba(0,0,0,0.25);
    }
    .crown.pressed { transform: translate(-50%, -50%) translateX(51.2cqw); }
    .crown:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .crown::before {
      content: '';
      position: absolute;
      left: -3cqw;
      top: 3.5cqw;
      width: 3.4cqw;
      height: 6cqw;
      background: linear-gradient(180deg, #8f969e, #e7eaed 45%, #8f969e);
    }

    .pusher {
      --push: 0cqw;
      width: 11cqw;
      height: 7cqw;
      cursor: pointer;
      background: transparent;
      transition: transform 0.08s ease;
    }
    .pusher.p-top { transform: translate(-50%, -50%) rotate(-38deg) translateX(calc(54cqw - var(--push))); }
    .pusher.p-bot { transform: translate(-50%, -50%) rotate(38deg) translateX(calc(54cqw - var(--push))); }
    .pusher.pressed { --push: 1.6cqw; }

    /* Tija + capçal del polsador (com un pistó cilíndric) */
    .pusher::before {
      content: '';
      position: absolute;
      left: 0;
      top: 1.6cqw;
      width: 6cqw;
      height: 3.8cqw;
      background: linear-gradient(180deg, #7f868e, #eef0f2 45%, #8e959d);
    }
    .pusher::after {
      content: '';
      position: absolute;
      left: 5cqw;
      top: 0;
      width: 5.6cqw;
      height: 7cqw;
      border-radius: 0 1.6cqw 1.6cqw 0;
      background: linear-gradient(180deg, #8a9199, #f4f6f7 40%, #c2c7cc 62%, #6f767e);
    }
    .pusher:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 2cqw; }

    /* SVG: colors temàtics per classe (funciona a Safari i Chrome) */
    .st-dial-a { stop-color: var(--dial-a); }
    .st-dial-b { stop-color: var(--dial-b); }
    .st-dial-c { stop-color: var(--dial-c); }
    .st-sub-a { stop-color: var(--sub-a); }
    .st-sub-b { stop-color: var(--sub-b); }
    .st-hand-a { stop-color: var(--hand-a); }
    .st-hand-b { stop-color: var(--hand-b); }
    .guil { stroke: var(--guil); }
    .snail { stroke: var(--snail); fill: none; }
    .ink-blue { fill: var(--ink-blue); }
    .ink { fill: var(--ink); }
    .ink-soft { fill: var(--ink-soft); }
    .tk { stroke: var(--ink); }
    .tk-blue { stroke: var(--ink-blue); }
    .tk-soft { stroke: var(--ink-soft); }
    .win { fill: var(--win-bg); stroke: var(--ink-soft); }
    .win-ink { fill: var(--win-ink); }
    /* Escala de dates de l'esfera */
    .diumenge { fill: var(--diumenge) !important; }
    .festiu { fill: var(--festiu) !important; font-weight: 800; }
    .dissabte { fill: var(--dissabte) !important; }
    .hol-dot { fill: var(--festiu); opacity: 0; transition: opacity .3s; }
    .hol-dot.on { opacity: 1; }
    /* Finestres (sempre de fons clar): colors foscos fixos, mateix fons */
    .win-ink.diumenge { fill: #7d1235 !important; }
    .win-ink.festiu { fill: #0f2257 !important; }
    .win-ink.dissabte { fill: #2e6bd1 !important; }
    .fds { flood-color: var(--hshadow); flood-opacity: var(--hshadow-op); }
    .fglow { flood-color: var(--glow); flood-opacity: var(--glow-op); }
    .crystal { opacity: var(--crystal-op); }
    .hands-fx { filter: url(#handFxDay); }
    html[data-theme="night"] .hands-fx { filter: url(#handFx); }
    html[data-theme="night"] .lume-night { filter: url(#lumeFx); }
    /* Mentre gira, sense halos (estalvia repintar filtres a cada fotograma) */
    .watch-container.flipping .lume-night { filter: none; }
    html[data-theme="night"] .watch-container.flipping .hands-fx { filter: url(#handFxDay); }
    .sub-fill { fill: var(--sub-a); }
    .dial-fill { fill: var(--dial-b); }

    .big-date-roll { transition: transform 0.7s cubic-bezier(.3,.1,.2,1); }
    .jump { transition: transform 0.09s ease-out; }

    text { font-family: Georgia, "Times New Roman", Times, serif; }
    .sans { font-family: -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif; }
    .breguet { font-family: "Bodoni 72", "Didot", "Bodoni MT", Georgia, serif; font-weight: 700; }
    .script { font-family: "Snell Roundhand", "Apple Chancery", "Brush Script MT", "Segoe Script", cursive; font-style: italic; }

    /* Barra del cronògraf sota el rellotge */
    .chrono-bar {
      width: min(100%, 360px);   /* amplada fixa: el calendari no es mou quan canvia el text */
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 999px;
      padding: 6px 8px 6px 14px;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      max-width: 100%;
    }
    .chrono-info { display: flex; flex-direction: column; line-height: 1.15; flex: 1 0 auto; }
    .chrono-time { white-space: nowrap; }
    .chrono-name { overflow: hidden; text-overflow: ellipsis;
      font-size: 0.62rem;
      font-weight: 800;
      letter-spacing: 1.2px;
      color: var(--muted);
      text-transform: uppercase;
      white-space: nowrap;
    }
    .chrono-time.flash { color: var(--accent); }
    .chrono-time {
      font-size: 1.05rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    .chrono-extra { font-size: 0.66rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #btn-start { min-width: 62px; }
    #btn-reset { min-width: 78px; }
    .chip-btn { flex: 0 0 auto; text-align: center; }
    .chip-btn {
      appearance: none;
      border: 1px solid var(--btn-border);
      background: var(--btn-bg);
      color: var(--accent);
      font-size: 0.68rem;
      font-weight: 800;
      letter-spacing: 0.3px;
      text-transform: uppercase;
      padding: 7px 11px;
      border-radius: 999px;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s ease, border-color 0.15s ease;
    }
    .chip-btn:hover, .chip-btn:active { background: var(--btn-hover-bg); border-color: var(--accent); }
    .chip-btn.on { background: var(--accent); color: var(--bg); border-color: var(--accent); }

    /* Calendari (mateix comportament que l'índex del PRS 516) */
    .calendar-section {
      max-width: 380px;
      width: 100%;
      max-height: calc(100dvh - 40px);
      overflow-y: auto;
      background: var(--panel-bg);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid var(--panel-border);
      border-radius: 20px;
      padding: 22px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
      transition: background 0.4s ease, border-color 0.4s ease;
    }
    .calendar-header { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 16px; }
    .month-year-title { white-space: nowrap; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
    .calendar-header-actions { flex: 0 0 auto; }
    .month-year-title {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--month-title-color);
      letter-spacing: 0.5px;
      cursor: pointer;
      user-select: none;
    }
    .calendar-header-actions { display: flex; align-items: center; gap: 6px; }
    .nav-btn { padding: 4px 9px; }
    .theme-icon { width: 0.95rem; height: 0.95rem; display: block; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .theme-toggle-btn { display: inline-flex; align-items: center; padding: 5px 9px; line-height: 1; }
    .theme-label { margin-left: 4px; font-size: 0.66rem; }
    .theme-auto-badge { font-size: 0.55rem; font-weight: 800; margin-left: 2px; vertical-align: super; color: var(--accent); }

    .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; text-align: center; }
    .weekday-header { font-size: 0.75rem; font-weight: 700; color: var(--weekday-color); padding-bottom: 8px; text-transform: uppercase; }
    .calendar-day-cell {
      aspect-ratio: 1 / 1;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 0.95rem;
      font-weight: 500;
      color: var(--cell-color);
      position: relative;
      z-index: 0;
      cursor: pointer;
      user-select: none;
    }
    .calendar-day-cell.other-month { color: var(--weekday-color); opacity: 0.4; font-weight: 400; cursor: default; }
    .calendar-day-cell.weekend { color: var(--weekend-color); font-weight: 600; }
    .calendar-day-cell.holiday { color: #ffffff; font-weight: 800; }
    .calendar-day-cell.holiday::before {
      content: '';
      position: absolute;
      z-index: -1;
      width: 78%;
      height: 78%;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, var(--hol-a) 0%, var(--hol-b) 100%);
      box-shadow: 0 2px 6px var(--hol-glow), inset 0 1px 1px rgba(255,255,255,0.25);
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
    }
    .calendar-day-cell.today { font-weight: 800; }
    .calendar-day-cell.today::after {
      content: '';
      position: absolute;
      z-index: 1;
      inset: 8%;
      border-radius: 50%;
      border: 2px solid var(--today-ring);
      box-shadow: 0 0 7px var(--today-ring-glow);
      pointer-events: none;
    }
    .calendar-day-cell.selected:not(.today) { outline: 1px dashed var(--accent); outline-offset: -3px; border-radius: 50%; }
    /* Marca de fase lunar (nova, quart creixent, plena, quart minvant) */
    .moon-mark {
      position: absolute;
      /* al costat del número (no a sota): no el trepitja quan les files són baixes */
      top: 50%;
      left: calc(50% + 0.95em);
      transform: translateY(-50%);
      font-size: 0.5rem;
      line-height: 1;
      color: var(--accent);
      pointer-events: none;
    }
    .moon-mark.special { color: #f08a24; font-weight: 900; }
    .calendar-day-cell.watch-set { box-shadow: inset 0 -2px 0 var(--accent); border-radius: 6px; }
    .day-info .set-note { display: block; font-size: 0.7rem; color: var(--accent); margin-top: 2px; }

    .day-info {
      margin-top: 10px;
      min-height: 2.4em;
      font-size: 0.8rem;
      line-height: 1.35;
      color: var(--muted);
      text-align: center;
    }
    .day-info b { color: var(--text); font-weight: 700; }

    .data-panel { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--panel-border); }
    .data-location { display: block; text-align: center; font-size: 0.78rem; font-weight: 600; letter-spacing: 0.5px; color: var(--muted); text-transform: uppercase; margin-bottom: 10px; }
    .data-scroll { display: flex; gap: 8px; overflow-x: auto; scroll-snap-type: x proximity; -webkit-overflow-scrolling: touch; padding-bottom: 6px; scrollbar-width: thin; }
    .data-scroll::-webkit-scrollbar { height: 4px; }
    .data-scroll::-webkit-scrollbar-thumb { background: var(--panel-border); border-radius: 4px; }
    .data-item {
      flex: 0 0 auto;
      min-width: 84px;
      scroll-snap-align: start;
      display: flex;
      flex-direction: column;
      gap: 2px;
      background: var(--data-item-bg);
      border: 1px solid var(--panel-border);
      border-radius: 10px;
      padding: 8px 10px;
    }
    .data-label { font-size: 0.65rem; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase; color: var(--data-label-color); white-space: nowrap; }
    .data-value { font-size: 1.02rem; font-weight: 700; color: var(--data-value-color); font-variant-numeric: tabular-nums; white-space: nowrap; }

    .hint { font-size: 0.66rem; color: var(--muted); text-align: center; opacity: 0.8; }

    /* ---------------- Mòbil vertical (iPhone) ---------------- */
    @media (max-width: 720px) {
      :root { --S: clamp(200px, min(84vw, calc(100dvh - 440px - env(safe-area-inset-top) - env(safe-area-inset-bottom))), 460px); }
      .app-container { flex-direction: column; justify-content: center; padding: 10px; gap: 10px;

<body>

  <!-- Definicions SVG compartides per les dues esferes -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <defs>
      <!-- Acer polit de la caixa i del bisell -->
      <linearGradient id="steelRing" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#fbfcfd"/>
        <stop offset="22%" stop-color="#c4c9cf"/>

      </linearGradient>
      <linearGradient id="steelBevel" x1="1" y1="1" x2="0" y2="0">
        <stop offset="0%" stop-color="#f7f8f9"/>
        <stop offset="30%" stop-color="#aab0b7"/>
        <stop offset="55%" stop-color="#5f666e"/>
        <stop offset="80%" stop-color="#c9ced3"/>
        <stop offset="100%" stop-color="#ffffff"/>
      </linearGradient>
      <radialGradient id="dialGrad" cx="42%" cy="34%" r="75%">
        <stop offset="0%" class="st-dial-a"/>
        <stop offset="55%" class="st-dial-b"/>

      </radialGradient>
      <radialGradient id="subGrad" cx="45%" cy="38%" r="70%">
        <stop offset="0%" class="st-sub-a"/>
        <stop offset="100%" class="st-sub-b"/>
      </radialGradient>
      <!-- Guilloché "gra d'ordi" -->
      <pattern id="barley" width="2.2" height="2.2" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
        <path d="M0 0 L2.2 0 M0 1.1 L1.1 1.1 M0 0 L0 2.2 M1.1 1.1 L1.1 2.2" class="guil" stroke-width="0.35" fill="none"/>
      </pattern>
      <!-- Acer pavonat (blau tèrmic) de les agulles -->
      <linearGradient id="blued" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" class="st-hand-a"/>
        <stop offset="50%" class="st-hand-b"/>
        <stop offset="100%" class="st-hand-a"/>
      </linearGradient>
      <filter id="handFx" x="-50%" y="-50%" width="200%" height="200%">
        <feDropShadow in="SourceGraphic" dx="0.5" dy="1" stdDeviation="0.6" class="fds" result="s"/>
        <feDropShadow in="s" dx="0" dy="0" stdDeviation="1.1" class="fglow"/>
      </filter>
      <filter id="handFxDay" x="-50%" y="-50%" width="200%" height="200%">
        <feDropShadow dx="0.5" dy="1" stdDeviation="0.6" flood-color="#000" flood-opacity="0.32"/>
      </filter>
      <filter id="lumeFx" x="-50%" y="-50%" width="200%" height="200%">
        <feDropShadow dx="0" dy="0" stdDeviation="0.9" class="fglow"/>
      </filter>
      <linearGradient id="crystalGrad" x1="0" y1="0" x2="0.6" y2="1">
        <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
        <stop offset="45%" stop-color="#ffffff" stop-opacity="0"/>

      <!-- Disc de la fase lunar -->
      <radialGradient id="skyGrad" cx="50%" cy="50%" r="60%">
        <stop offset="0%" stop-color="#2d5bc9"/>
        <stop offset="100%" stop-color="#112d78"/>

      <radialGradient id="moonGold" cx="38%" cy="35%" r="70%">

        <stop offset="100%" stop-color="#b8860b"/>

                <path d="M88.4 140 A11.6 11.6 0 0 1 111.6 140" fill="none" class="tk-soft" stroke-width="0.35"/>

                </g>

                  <g id="g-ssec"></g>

                  <g id="g-hour"></g>

    <!-- Calendari -->

  <script>
    'use strict';
    const SVGNS = 'http://www.w3.org/2000/svg';
    const $ = id => document.getElementById(id);

    function el(tag, attrs, parent, text) {
      const n = document.createElementNS(SVGNS, tag);
      for (const k in attrs) n.setAttribute(k, attrs[k]);
      if (text !== undefined) n.textContent = text;
      if (parent) parent.appendChild(n);
      return n;
    }
    // Punt en coordenades polars: angle en graus, 0 = 12 h, sentit horari
    function P(cx, cy, r, deg) {
      const a = deg * Math.PI / 180;
      return [cx + r * Math.sin(a), cy - r * Math.cos(a)];
    }
    function tick(parent, cx, cy, r1, r2, deg, w, cls) {
      const [x1, y1] = P(cx, cy, r1, deg), [x2, y2] = P(cx, cy, r2, deg);
      return el('line', { x1, y1, x2, y2, 'stroke-width': w, class: cls || 'tk' }, parent);
    }
    function label(parent, cx, cy, r, deg, txt, size, cls, rot) {
      const [x, y] = P(cx, cy, r, deg);
      const t = el('text', { x, y, 'font-size': size, 'text-anchor': 'middle', 'dominant-baseline': 'central', class: cls || 'ink' }, parent, txt);
      if (rot !== undefined) t.setAttribute('transform', `rotate(${rot} ${x} ${y})`);
      return t;
    }
    // Fons "cargolat" (snailing) de les subesferes: cercles concèntrics molt fins
    function subdialBase(parent, cx, cy, r) {
      el('circle', { cx, cy, r: r + 0.6, fill: 'none', class: 'tk-soft', 'stroke-width': 0.3 }, parent);
      el('circle', { cx, cy, r, fill: 'url(#subGrad)' }, parent);
      for (let rr = 1.2; rr < r; rr += 0.75) el('circle', { cx, cy, r: rr, class: 'snail', 'stroke-width': 0.22 }, parent);
    }
    // Agulla petita de subesfera (apunta amunt des de cx,cy)
    function subHand(parent, cx, cy, len, w, tail) {
      el('path', { d: `M${cx} ${cy + tail} L${cx - w} ${cy} L${cx} ${cy - len} L${cx + w} ${cy} Z`, fill: 'url(#blued)' }, parent);
      el('circle', { cx, cy, r: 1.35, fill: 'url(#blued)' }, parent);
      el('circle', { cx, cy, r: 0.5, fill: '#c9ced3' }, parent);
    }

    // =================================================================
    //  ESFERA MALVINES — cronògraf de triple calendari amb fase lunar.
    //  Arquitectura del calibre tipus Valjoux 7751 (28.800 alt/h):
    //   · Centre: hores, minuts, segons del crono i agulla de la data
    //     (punta en mitja lluna) sobre l'escala perimetral 1–31.
    //   · Les 12: comptador de 30 minuts del crono + finestres DIA i MES.
    //   · Les 9: segons continus (petita segonera) + indicador 24 h.
    //   · Les 6: comptador de 12 hores del crono + fase lunar.
    //   · Pistó 2 h: start/stop · Pistó 4 h: posada a zero (només aturat).
    // =================================================================
    const M = { c12: [100, 60], c9: [61, 100], c6: [100, 140] };

    (function buildMalvines() {
      const sc = $('m-scales');
      // Escala de la data 1–31 (el 31 a dalt)
      el('circle', { cx: 100, cy: 100, r: 80.6, fill: 'none', class: 'tk-blue', 'stroke-width': 0.35 }, sc);
      for (let n = 1; n <= 31; n++) {
        const deg = n / 31 * 360;
        const rot = (deg > 90 && deg < 270) ? deg + 180 : deg;
        const t = label(sc, 100, 100, 84.6, deg, String(n), 4.4, 'ink-blue sans', rot);
        t.setAttribute('id', 'm-dnum-' + n);
        const [dx, dy] = P(100, 100, 88.4, deg);
        el('circle', { cx: dx, cy: dy, r: 0.6, id: 'm-hdot-' + n, class: 'hol-dot' }, sc);
        t.setAttribute('font-weight', '600');
        tick(sc, 100, 100, 80.6, 81.8, deg - 180 / 31, 0.25, 'tk-blue');
      }
      // Pista ferroviària: minuts i cinquens de segon
      el('circle', { cx: 100, cy: 100, r: 78.2, fill: 'none', class: 'tk', 'stroke-width': 0.3 }, sc);

    // =================================================================
    //  ESFERA GIULIETTA — cronògraf flyback amb gran data panoràmica.
    //   · Centre: hores, minuts i segons del crono.
    //   · Les 9: petita segonera contínua (marxa del rellotge).
    //   · Les 3: comptador de 30 minuts que SALTA d'un cop cada minut.
    //   · Les 6: gran data de dos discs (desenes + unitats).
    //   · Perímetre: taquímetre base 1000 m (km/h = 3600 / segons).
    //   · Pistó 2 h: start/stop · Pistó 4 h: zero (aturat) o FLYBACK
    //     (en marxa: torna a zero i torna a arrencar a l'instant).
    // =================================================================
    const G = { c9: [64, 104], c3: [136, 104] };
    const TACHY = [60, 65, 70, 75, 80, 85, 90, 95, 100, 110, 120, 130, 140, 150, 160, 170, 180, 200, 220, 240, 270, 300, 350, 400, 500];

    (function buildGiulietta() {
      const sc = $('g-scales');
      // Taquímetre
      el('circle', { cx: 100, cy: 100, r: 87.4, fill: 'none', class: 'tk', 'stroke-width': 0.3 }, sc);

        const deg = (3600 / v) * 6;

        const t = label(sc, 100, 100, 84, deg, String(v), 3.5, 'ink sans', rot);

      for (let v = 105; v < 300; v += 5) if (!TACHY.includes(v)) tick(sc, 100, 100, 79.4, 80.4, (3600 / v) * 6, 0.18);

      // Pista ferroviària interior

      // Les 3: comptador de 30 minuts
